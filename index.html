<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paint The Town Red</title>
    <style>
      html,
      body,
      #gameContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      html,
      body {
        position: fixed;
        inset: 0;
        background: #231f20;
      }

      #gameContainer {
        position: absolute;
        inset: 0;
        background: #231f20;
      }

      #gameContainer canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        border: 0;
      }

      #loadError {
        position: fixed;
        z-index: 10;
        inset: auto 1rem 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid #a33;
        border-radius: 0.5rem;
        background: #1b1111;
        color: #ffdede;
        white-space: pre-wrap;
        font: 14px/1.4 monospace;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
    <script>
      function showLoadError(message) {
        console.error("Unity WebGL startup error:", message);
        const panel = document.createElement("pre");
        panel.id = "loadError";
        panel.textContent = "Unity WebGL startup error: " + message;
        document.body.appendChild(panel);
      }

      const loader = document.createElement("script");
      loader.src = "./Build/UnityLoader.js";
      loader.onerror = () => showLoadError("Could not load Build/UnityLoader.js.");
      loader.onload = () => {
        try {
          window.gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "./Build/WebGL-Release.json",
            {},
          );
        } catch (error) {
          showLoadError(error?.message || String(error));
        }
      };
      document.body.appendChild(loader);

      const gameContainer = document.getElementById("gameContainer");
      new ResizeObserver(() => window.dispatchEvent(new Event("resize"))).observe(gameContainer);
    </script>
  </body>
</html>
